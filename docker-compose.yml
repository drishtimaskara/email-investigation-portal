services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: investigation-server
    restart: unless-stopped
    environment:
      - PORT=5001
      - JWT_SECRET=${JWT_SECRET:-arg-investigation-portal-secret-key-2026}
    volumes:
      - ./database:/app/database
      - ./client/src/data:/app/client/src/data:ro
    networks:
      - portal-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: investigation-client
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - server
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge
